name: Brasil Breaking

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar os arquivos do repositorio
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Procurar breaking e avisar no Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID_BREAKING: ${{ secrets.CHAT_ID_BREAKING }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python brasil_breaking.py --minutos 90

      # O alerta ja foi enviado na etapa acima. Esta etapa so guarda o
      # log, entao ela NUNCA deve derrubar a rodada: quando alguem
      # commita no mesmo minuto, o push e rejeitado e o robo mandava
      # e-mail de erro sem ter erro nenhum. Agora tenta de novo, e se
      # ainda assim nao der, avisa no log e segue em paz.
      - name: Guardar o log da medicao
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add log.txt brasil_vistos.json brasil_enviados.json ancapsu_vistos.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nada novo no log."
            exit 0
          fi
          git commit -m "medicao brasil $(date -u '+%Y-%m-%d %H:%M UTC')"
          for tentativa in 1 2 3 4; do
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            if git push; then
              echo "log guardado na tentativa $tentativa"
              exit 0
            fi
            echo "push rejeitado (alguem commitou junto). Tentando de novo..."
            sleep $((tentativa * 5))
          done
          echo "Nao consegui guardar o log agora. O alerta JA foi enviado;"
          echo "a proxima rodada grava tudo junto."
          exit 0
