name: Flavio

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar

jobs:
  rodar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rodar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHAT_ID_FLAVIO }}
        run: python alvo.py flavio
      - name: Salvar historico
        run: |
          git config user.name "radar-bot"
          git config user.email "bot@radar"
          git add alvo_enviados_flavio.json || true
          git diff --staged --quiet || git commit -m "historico flavio"
          git pull --rebase || true
          git push || true
