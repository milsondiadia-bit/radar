name: Teste Chave

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Chave ATUAL
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ROTULO: ATUAL
        run: python teste_chave.py
      - name: Chave NOVA
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_KEY_NOVA }}
          ROTULO: NOVA
        run: python teste_chave.py
      - name: Guardar
        run: |
          git config user.name "radar-bot"
          git config user.email "bot@radar"
          git add teste_chave.txt || true
          git diff --staged --quiet || git commit -m "diagnostico das duas chaves"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push || true
